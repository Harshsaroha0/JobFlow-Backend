<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — JobFlow</title><link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a class="brand" href="../index.html">Job<span>Flow</span></a>
    <section class="auth-card">
      <div class="auth-heading"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to JobFlow</h1><p>Continue managing your job search.</p></div>
      <form id="loginForm" class="form">
        <label>Email<input id="email" type="email" placeholder="you@example.com" required></label>
        <label>Password<input id="password" type="password" placeholder="••••••••" required></label>
        <button class="btn btn-primary btn-full" type="submit">Sign in</button>
        <p id="formMessage" class="form-message"></p>
      </form>
      <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
    </section>
  </main>
  <script src="../js/app.js"></script>
</body>
</html>
