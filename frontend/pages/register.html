<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — JobFlow</title><link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a class="brand" href="../index.html">Job<span>Flow</span></a>
    <section class="auth-card">
      <div class="auth-heading"><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p>Set up your personal job-search workspace.</p></div>
      <form id="registerForm" class="form">
        <div class="two-col">
          <label>First name<input id="firstName" type="text" placeholder="First name" required></label>
          <label>Last name<input id="lastName" type="text" placeholder="Last name" required></label>
        </div>
        <label>Email<input id="email" type="email" placeholder="you@example.com" required></label>
        <label>Password<input id="password" type="password" placeholder="At least 8 characters" minlength="8" required></label>
        <button class="btn btn-primary btn-full" type="submit">Create account</button>
        <p id="formMessage" class="form-message"></p>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
    </section>
  </main>
  <script src="../js/app.js"></script>
</body>
</html>
