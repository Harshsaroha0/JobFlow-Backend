<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jobs — JobFlow</title><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app">
<aside class="sidebar" id="sidebar"><a class="brand" href="../index.html">Job<span>Flow</span></a><nav class="side-nav"><a href="dashboard.html">⌂ <span>Dashboard</span></a><a class="active" href="jobs.html">▤ <span>Jobs</span></a><a href="resume.html">▱ <span>Resume</span></a><a href="ai-analysis.html">✦ <span>AI Analysis</span></a><a href="profile.html">○ <span>Profile</span></a></nav><button id="logoutBtn" class="logout">↪ <span>Logout</span></button></aside>
<main class="app-main"><header class="app-header"><button class="menu-btn" id="sidebarBtn">☰</button><div><p class="eyebrow">APPLICATIONS</p><h1>Jobs</h1></div><a class="avatar" href="profile.html">HS</a></header>
<section class="toolbar"><div><h2>My applications</h2><p>Keep every opportunity organized.</p></div><button class="btn btn-primary" id="addJobBtn">+ Add job</button></section>
<section class="card content-card"><div class="filters"><input id="jobSearch" class="form-control" placeholder="Search jobs or companies..."><select id="statusFilter" class="form-control"><option value="ALL">All statuses</option><option value="SAVED">Saved</option><option value="APPLIED">Applied</option><option value="INTERVIEW">Interview</option><option value="REJECTED">Rejected</option></select></div>
<div class="job-list" id="jobList"></div></section></main></div>
<div class="modal hidden" id="jobModal"><div class="modal-card"><button class="modal-close" id="closeModal">×</button><h2>Add a job</h2><p>Demo form — ready to connect to the Spring Boot API.</p><form id="jobForm" class="form"><label>Job title<input id="jobTitle" required placeholder="Java Backend Developer"></label><label>Company<input id="company" required placeholder="Company name"></label><label>Location<input id="location" placeholder="Noida"></label><label>Status<select id="jobStatus"><option>SAVED</option><option>APPLIED</option><option>INTERVIEW</option></select></label><button class="btn btn-primary btn-full">Save job</button></form></div></div>
<script src="../js/app.js"></script></body></html>
