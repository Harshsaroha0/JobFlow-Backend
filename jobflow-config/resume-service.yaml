server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/jobflow
    username: root
    password: harsh
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

file:
  storage:
    location: D:/JobFlow-Backend/storage/resumes

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true